<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品卡片</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    body {
        background-color: #f1f1f1;
    }

    .product {
        margin: 50px auto;
        padding-top: 40px;
        width: 270px;
        height: 253px;
        background-color: #fff;
        text-align: center;
        border-radius: 20px;
    }
    
    .product h4{
        margin-bottom: 12px;
    }

    .product p {
        color: #555;
    }

    .yuan {
        margin: 0 auto;
        margin-bottom: 20px;
        background-color:pink;
        border-radius: 50%;
        width: 100px;
        height: 100px;
    }
    </style>

</head>
<body>
    <div class="product">
        <div class="yuan"></div>
        <h4>抖音直播SDK</h4>
        <p>包含直播和看播功能</p>
    </div>
</body>
</html>
